<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="howTitle howDesc">
  <title id="howTitle">How Raemote connects your phone to your apps</title>
  <desc id="howDesc">Your phone holds an end-to-end encrypted connection to raemoted on your own computer — directly when the network allows, otherwise through a public relay that cannot read the traffic. Raemote then reverse-proxies each app to the local web apps running on that machine.</desc>
  <defs>
    <marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3478f6"/>
    </marker>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6aa5ff"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .box { fill: #ffffff; stroke: #c9d0d9; stroke-width: 1.5; }
    .box-accent { fill: #eef4fd; stroke: #3478f6; stroke-width: 1.5; }
    .t { fill: #171a1f; font-size: 15px; font-weight: 650; }
    .s { fill: #4d5560; font-size: 12.5px; }
    .tiny { fill: #6d7683; font-size: 11.5px; }
    .wire { stroke: #3478f6; stroke-width: 2.5; fill: none; marker-end: url(#a-light); }
    .wire-plain { stroke: #3478f6; stroke-width: 2.5; fill: none; }
    .dash { stroke: #8b95a1; stroke-width: 2; stroke-dasharray: 5 6; fill: none; marker-end: url(#a-light); }
    .lock { fill: #e7f6fb; stroke: #197295; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #303a45; }
      .box-accent { fill: #14243c; stroke: #6aa5ff; }
      .t { fill: #e8ecf1; }
      .s { fill: #b3bcc7; }
      .tiny { fill: #8b95a1; }
      .wire { stroke: #6aa5ff; marker-end: url(#a-dark); }
      .wire-plain { stroke: #6aa5ff; }
      .dash { stroke: #7d8894; marker-end: url(#a-dark); }
      .lock { fill: #10262c; stroke: #35c3e8; }
    }
  </style>

  <!-- phone -->
  <rect class="box" x="26" y="120" width="104" height="176" rx="20"/>
  <rect class="box-accent" x="38" y="136" width="80" height="140" rx="10"/>
  <text class="s" x="78" y="180" text-anchor="middle">your</text>
  <text class="t" x="78" y="200" text-anchor="middle">phone</text>
  <text class="tiny" x="78" y="238" text-anchor="middle">Raemote app</text>
  <text class="tiny" x="78" y="316" text-anchor="middle">apps open in</text>
  <text class="tiny" x="78" y="331" text-anchor="middle">Safari</text>

  <!-- relay path -->
  <path class="dash" d="M130 158 C 240 92, 350 92, 452 112"/>
  <text class="tiny" x="292" y="58" text-anchor="middle">through a public relay if a direct path is blocked</text>
  <text class="tiny" x="292" y="74" text-anchor="middle">it forwards bytes it cannot read</text>

  <!-- direct path -->
  <path class="wire" d="M130 240 L 452 240"/>
  <text class="tiny" x="291" y="266" text-anchor="middle">direct, end-to-end encrypted</text>

  <!-- server -->
  <rect class="box-accent" x="452" y="104" width="186" height="208" rx="18"/>
  <text class="t" x="545" y="146" text-anchor="middle">raemoted</text>
  <text class="s" x="545" y="168" text-anchor="middle">on your computer</text>
  <rect class="lock" x="482" y="188" width="126" height="34" rx="9"/>
  <text class="s" x="545" y="210" text-anchor="middle">only paired devices</text>
  <text class="tiny" x="545" y="252" text-anchor="middle">finds your apps · proxies</text>
  <text class="tiny" x="545" y="268" text-anchor="middle">them to 127.0.0.1:&lt;port&gt;</text>
  <text class="tiny" x="545" y="296" text-anchor="middle">stays on your machine</text>

  <!-- server to apps -->
  <path class="wire-plain" d="M638 150 C 690 150, 690 108, 726 108"/>
  <path class="wire-plain" d="M638 208 L 726 208"/>
  <path class="wire-plain" d="M638 266 C 690 266, 690 308, 726 308"/>

  <!-- apps -->
  <rect class="box" x="726" y="72" width="212" height="72" rx="14"/>
  <text class="t" x="748" y="104">Jellyfin</text>
  <text class="tiny" x="748" y="124">http://localhost:8096</text>

  <rect class="box" x="726" y="172" width="212" height="72" rx="14"/>
  <text class="t" x="748" y="204">Home Assistant</text>
  <text class="tiny" x="748" y="224">http://localhost:8123</text>

  <rect class="box" x="726" y="272" width="212" height="72" rx="14"/>
  <text class="t" x="748" y="304">your dev server</text>
  <text class="tiny" x="748" y="324">http://localhost:5173</text>
</svg>
